// ── Eingangscheck ───────────────────────────────────────────

      'Er besteht aus zwei Ästen (Hyperbel) mit Lücke bei \\(x = 0\\)',
      'Er ist eine Halbgerade, die nur rechts von der y-Achse existiert'
    ],
    korrekt: 0,
    loesungsweg: '\\(x^3\\) hat einen ungeraden Exponenten: Der Graph ist punktsymmetrisch zum Ursprung, verläuft durch \\((0\\,|\\,0)\\) und steigt (S-Form). Die U-Form gehört zu \\(x^2\\), die Hyperbel zu \\(x^{-1}\\), die Halbgerade zu \\(\\sqrt{x}\\).' },
  { typ: 'numerisch',
    frage: 'Gegeben ist \\(f(x) = x^4\\). Berechne \\(f(-2)\\).',
    loesung: 16,
    loesungsweg: '\\(f(-2) = (-2)^4 = (-2) \\cdot (-2) \\cdot (-2) \\cdot (-2) = 16\\). Gerader Exponent: Das Ergebnis ist positiv.' },
  { typ: 'mc',
    frage: 'Was ist der Definitionsbereich von \\(f(x) = \\sqrt{x}\\)?',
    optionen: [
      '\\(D = [0;\\infty[\\) — alle Zahlen \\(x \\geq 0\\)',
      '\\(D = \\mathbb{R}\\) — alle reellen Zahlen',
      '\\(D = \\;]0;\\infty[\\) — alle Zahlen \\(x > 0\\)'
    ],
    korrekt: 0,
    loesungsweg: 'Unter der Wurzel darf keine negative Zahl stehen, also \\(x \\geq 0\\). Die Null ist erlaubt: \\(\\sqrt{0} = 0\\). Damit ist \\(D = [0;\\infty[\\).' },
  { typ: 'numerisch',
    frage: 'Gegeben ist \\(f(x) = x^{-2}\\). Berechne \\(f(-1)\\).',
    loesung: 1,
    loesungsweg: '\\(f(-1) = (-1)^{-2} = \\frac{1}{(-1)^2} = \\frac{1}{1} = 1\\). Negativer Exponent heißt: Kehrwert der Potenz bilden.' }
];

// ── Technik (Theorie) ───────────────────────────────────────
const THEORIE = [
  { titel: 'Potenzfunktionen f(x) = xⁿ',
    html: `
<p>Eine <strong>Potenzfunktion</strong> hat die Form \\(f(x) = x^n\\). Wie ihr Graph aussieht, hängt vom Exponenten \\(n\\) ab — es gibt <strong>vier Grundtypen</strong>:</p>
<div class="eigen-tabelle-wrap">
<table class="eigen-tabelle">
  <tr><th></th><th>\\(n\\) gerade, positiv<br>(z.&nbsp;B. \\(x^2, x^4\\))</th><th>\\(n\\) ungerade, positiv<br>(z.&nbsp;B. \\(x^3, x^5\\))</th><th>\\(n\\) gerade, negativ<br>(z.&nbsp;B. \\(x^{-2}\\))</th><th>\\(n\\) ungerade, negativ<br>(z.&nbsp;B. \\(x^{-1}\\))</th></tr>
  <tr><td><strong>Symmetrie</strong></td><td>achsensymm. (y-Achse)</td><td>punktsymm. (Ursprung)</td><td>achsensymm. (y-Achse)</td><td>punktsymm. (Ursprung)</td></tr>
  <tr><td><strong>D</strong></td><td>\\(\\mathbb{R}\\)</td><td>\\(\\mathbb{R}\\)</td><td>\\(\\mathbb{R}\\setminus\\{0\\}\\)</td><td>\\(\\mathbb{R}\\setminus\\{0\\}\\)</td></tr>
  <tr><td><strong>W</strong></td><td>\\([0;\\infty[\\)</td><td>\\(\\mathbb{R}\\)</td><td>\\(]0;\\infty[\\)</td><td>\\(\\mathbb{R}\\setminus\\{0\\}\\)</td></tr>
  <tr><td><strong>\\(x \\to +\\infty\\)</strong></td><td>\\(f(x) \\to +\\infty\\)</td><td>\\(f(x) \\to +\\infty\\)</td><td>\\(f(x) \\to 0\\)</td><td>\\(f(x) \\to 0\\)</td></tr>
  <tr><td><strong>\\(x \\to -\\infty\\)</strong></td><td>\\(f(x) \\to +\\infty\\)</td><td>\\(f(x) \\to -\\infty\\)</td><td>\\(f(x) \\to 0\\)</td><td>\\(f(x) \\to 0\\)</td></tr>
</table>
</div>
<p><strong>Merke:</strong> Gerader Exponent → U-Form und Achsensymmetrie. Ungerader Exponent → S-Form und Punktsymmetrie.</p>
<svg viewBox="0 0 320 230" role="img" aria-label="Graphen von x hoch 2 und x hoch 3 im Koordinatensystem" style="max-width:100%;height:auto;display:block;margin:0.5em auto;">
  <!-- Gitter -->
  <g stroke="#d0d7e2" stroke-width="1">
    <line x1="40" y1="10" x2="40" y2="220"/><line x1="80" y1="10" x2="80" y2="220"/>
    <line x1="160" y1="10" x2="160" y2="220"/><line x1="200" y1="10" x2="200" y2="220"/>
    <line x1="240" y1="10" x2="240" y2="220"/><line x1="280" y1="10" x2="280" y2="220"/>
    <line x1="10" y1="35" x2="310" y2="35"/><line x1="10" y1="75" x2="310" y2="75"/>
    <line x1="10" y1="155" x2="310" y2="155"/><line x1="10" y1="195" x2="310" y2="195"/>
  </g>
  <!-- Achsen -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="10" y1="115" x2="310" y2="115"/>
    <line x1="120" y1="220" x2="120" y2="12"/>
  </g>
  <polygon points="310,115 300,111 300,119" fill="#333"/>
  <polygon points="120,12 116,22 124,22" fill="#333"/>
  <text x="300" y="132" font-size="12" fill="#333">x</text>
  <text x="104" y="20" font-size="12" fill="#333">y</text>
  <text x="110" y="131" font-size="11" fill="#333">0</text>
  <text x="156" y="131" font-size="11" fill="#333">1</text>
  <text x="104" y="79" font-size="11" fill="#333">1</text>
  <!-- x^2: Skala 40px = 1 Einheit, Ursprung (120|115); exakte Parabel als quadratische Bezier -->
  <path d="M 56,12.6 Q 120,217.4 184,12.6" fill="none" stroke="var(--fit-primary)" stroke-width="2.5"/>
  <text x="196" y="30" font-size="12" fill="var(--fit-primary)">f(x) = x²</text>
  <!-- x^3: exakte kubische Bezier von x=-1.28 bis 1.28 -->
  <path d="M 68.8,198.9 C 102.9,31.1 137.1,198.9 171.2,31.1" fill="none" stroke="var(--fit-secondary)" stroke-width="2.5"/>
  <text x="180" y="60" font-size="12" fill="var(--fit-secondary)">g(x) = x³</text>
</svg>
<p>Beide Graphen laufen durch \\((0\\,|\\,0)\\) und \\((1\\,|\\,1)\\) — aber links der y-Achse trennen sie sich: \\(x^2\\) geht nach oben, \\(x^3\\) nach unten.</p>` },
  { titel: 'Negative Exponenten — Hyperbeln',
    html: `
<p>Ein negativer Exponent bedeutet <strong>Kehrwert</strong>:</p>
<p>$$x^{-1} = \\frac{1}{x} \\qquad x^{-2} = \\frac{1}{x^2}$$</p>
<p>Weil man durch \\(x\\) teilt, ist \\(x = 0\\) <strong>verboten</strong> — dort hat die Funktion eine <strong>Definitionslücke</strong>. Der Graph besteht aus zwei getrennten Ästen (<strong>Hyperbel</strong>).</p>
<ul>
  <li><strong>Nahe bei 0:</strong> Teilst du 1 durch eine winzige Zahl, wird das Ergebnis riesig. Der Graph schmiegt sich an die <strong>y-Achse</strong> an und schießt nach oben bzw. unten — die y-Achse ist eine <strong>senkrechte Asymptote</strong>.</li>
  <li><strong>Für \\(x \\to \\pm\\infty\\):</strong> Teilst du 1 durch eine riesige Zahl, kommt fast 0 heraus. Der Graph schmiegt sich an die <strong>x-Achse</strong> an — sie ist eine <strong>waagerechte Asymptote</strong>. Erreicht wird sie nie!</li>
</ul>
<p><strong>Unterschied der beiden:</strong> \\(x^{-1}\\) ist punktsymmetrisch, die Äste liegen im I. und III. Quadranten. \\(x^{-2}\\) ist achsensymmetrisch, beide Äste liegen <em>oberhalb</em> der x-Achse (denn \\(\\frac{1}{x^2} > 0\\) für alle \\(x \\neq 0\\)).</p>
<p><strong>Beispiel:</strong> Für \\(f(x) = x^{-1}\\) gilt \\(f(0{,}1) = 10\\), \\(f(0{,}01) = 100\\), aber \\(f(100) = 0{,}01\\).</p>` },
  { titel: 'Wurzelfunktionen',
    html: `
<p>Die <strong>Wurzelfunktion</strong> \\(f(x) = \\sqrt{x}\\) ist die <strong>Umkehrung des Quadrierens</strong> — aber nur im I. Quadranten: Aus \\(3^2 = 9\\) wird \\(\\sqrt{9} = 3\\).</p>
<ul>
  <li><strong>Definitionsbereich:</strong> \\(D = [0;\\infty[\\) — unter der Wurzel darf nichts Negatives stehen.</li>
  <li><strong>Wertebereich:</strong> \\(W = [0;\\infty[\\) — die Wurzel liefert nie negative Werte.</li>
  <li><strong>Keine Symmetrie:</strong> Der Graph ist eine Kurve, die im Ursprung startet, steil beginnt und immer flacher steigt.</li>
</ul>
<p><strong>Wertepaare zum Skizzieren:</strong></p>
<p>\\(\\sqrt{0} = 0\\), \\(\\;\\sqrt{1} = 1\\), \\(\\;\\sqrt{4} = 2\\), \\(\\;\\sqrt{9} = 3\\), \\(\\;\\sqrt{16} = 4\\)</p>
<p>Zwischen 0 und 1 liegt die Kurve <em>über</em> der Geraden \\(y = x\\) (z.&nbsp;B. \\(\\sqrt{0{,}25} = 0{,}5\\)), danach darunter — sie wächst immer weiter, aber immer langsamer.</p>` },
  { titel: 'Verschieben, Strecken, Spiegeln',
    html: `
<p>Aus der Grundfunktion \\(x^n\\) entstehen durch drei Parameter neue Funktionen:</p>
<p>$$f(x) = a \\cdot (x + d)^n + e$$</p>
<ul>
  <li>\\(a\\): <strong>streckt</strong> den Graphen in y-Richtung (\\(|a| > 1\\)) oder <strong>staucht</strong> ihn (\\(|a| < 1\\)). Bei negativem \\(a\\) wird zusätzlich an der <strong>x-Achse gespiegelt</strong>.<br><em>Mini-Beispiel:</em> \\(f(x) = -2x^2\\) ist eine nach unten geöffnete, gestreckte Parabel.</li>
  <li>\\(d\\): <strong>verschiebt nach links</strong> (bei \\(+d\\)) bzw. nach rechts (bei \\(-d\\)). Achtung, das fühlt sich „verkehrt herum" an!<br><em>Mini-Beispiel:</em> \\(f(x) = (x + 4)^3\\) ist \\(x^3\\), um 4 nach <strong>links</strong> verschoben; \\(f(x) = (x - 4)^3\\) entsprechend um 4 nach rechts.</li>
  <li>\\(e\\): <strong>verschiebt nach oben</strong> (\\(e > 0\\)) bzw. unten (\\(e < 0\\)).<br><em>Mini-Beispiel:</em> \\(f(x) = x^4 - 3\\) ist \\(x^4\\), um 3 nach unten verschoben.</li>
</ul>
<p><strong>Hinweis:</strong> In der Scheitelpunktform quadratischer Funktionen schreibt man \\(a(x - d)^2 + e\\) — dort ist \\(d\\) direkt die x-Koordinate des Scheitels. Achte also auf das <em>Vorzeichen in der Klammer</em>, nicht auf den Buchstaben.</p>
<p><strong>Alles zusammen:</strong> \\(f(x) = 3(x - 2)^3 + 5\\) ist \\(x^3\\), um Faktor 3 gestreckt, um 2 nach rechts und um 5 nach oben verschoben.</p>
<p><strong>Hinweis:</strong> Das funktioniert genauso bei Wurzelfunktionen: \\(f(x) = \\sqrt{x + 1} - 2\\) startet im Punkt \\((-1\\,|\\,-2)\\) statt im Ursprung.</p>` }
];

  { id: 5, stufe: 1, typ: 'mc',
