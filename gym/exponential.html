// ── Technik (Theorie) ───────────────────────────────────────
const THEORIE = [
  { titel: 'Exponentielles Wachstum',
    html: `
<p>Wächst (oder schrumpft) ein Bestand in jedem Zeitschritt um den <strong>gleichen Faktor</strong>, spricht man von <strong>exponentiellem Wachstum</strong>:</p>
<p>$$B(t) = a \\cdot b^t $$</p>
<ul>
  <li>\\(a\\) ist der <strong>Anfangsbestand</strong>: \\(B(0) = a \\cdot b^0 = a\\).</li>
  <li>\\(b\\) ist der <strong>Wachstumsfaktor</strong>: Er sagt, womit pro Zeitschritt multipliziert wird.</li>
  <li>\\(b > 1\\): <strong>Wachstum</strong> — der Bestand nimmt zu.</li>
  <li>\\(0 < b < 1\\): <strong>Abnahme</strong> (exponentieller Zerfall) — der Bestand schrumpft.</li>
</ul>
<p>Aus <strong>Prozentangaben</strong> bestimmst du \\(b\\) so:</p>
<ul>
  <li>Zunahme um \\(p\\,\\%\\) pro Schritt: \\(b = 1 + \\frac{p}{100}\\) &nbsp;(z.&nbsp;B. +8 % → \\(b = 1{,}08\\))</li>
  <li>Abnahme um \\(p\\,\\%\\) pro Schritt: \\(b = 1 - \\frac{p}{100}\\) &nbsp;(z.&nbsp;B. −8 % → \\(b = 0{,}92\\))</li>
</ul>
<p><strong>Zahlenbeispiel:</strong> Auf einem Sparkonto liegen 300 €, jedes Jahr kommen 4 % Zinsen dazu. Dann ist \\(B(t) = 300 \\cdot 1{,}04^t\\), und nach 2 Jahren: \\(B(2) = 300 \\cdot 1{,}04^2 = 324{,}48\\) €.</p>
<svg viewBox="0 0 320 230" role="img" aria-label="Wachsende und fallende Exponentialkurve im Koordinatensystem, beide durch den Punkt (0|1)" style="max-width:100%;height:auto;display:block;margin:0.5em auto;">

<p>Im Bild: Beide Kurven gehen durch \\((0\\,|\\,1)\\) — die rote wächst (\\(b > 1\\)), die pinke fällt (\\(0 < b < 1\\)).</p>` },
  { titel: 'Die Exponentialfunktion f(x) = bˣ',
    html: `
<p>Die Grundform der <strong>Exponentialfunktion</strong> ist</p>
<p>$$f(x) = b^x \\qquad \\text{mit } b > 0,\\; b \\neq 1 $$</p>
<p>Hier steht die Variable \\(x\\) <em>im Exponenten</em> — das unterscheidet sie von Potenzfunktionen wie \\(x^2\\). Ihre wichtigsten Eigenschaften:</p>
<ul>
  <li><strong>Definitionsbereich:</strong> \\(D = \\mathbb{R}\\) — du darfst jede Zahl einsetzen.</li>
  <li><strong>Wertebereich:</strong> \\(W = \\left]0\\,;\\,\\infty\\right[\\) — die Funktionswerte sind immer positiv, nie null.</li>
  <li>Der Graph geht immer durch \\((0\\,|\\,1)\\), denn \\(b^0 = 1\\), und durch \\((1\\,|\\,b)\\), denn \\(b^1 = b\\).</li>
  <li>Die <strong>x-Achse ist Asymptote</strong>: Der Graph kommt ihr beliebig nahe, berührt sie aber nie.</li>
  <li>Die Funktion ist <strong>streng monoton</strong>: steigend für \\(b > 1\\), fallend für \\(0 < b < 1\\).</li>
</ul>
<p><strong>Beispiel:</strong> \\(f(x) = 3^x\\) geht durch \\((0\\,|\\,1)\\) und \\((1\\,|\\,3)\\); für negative \\(x\\) wird sie klein, aber nie null: \\(f(-2) = 3^{-2} = \\frac{1}{9}\\).</p>` },
  { titel: 'Verschieben, Strecken, Spiegeln',
    html: `
<p>Aus \\(b^x\\) entstehen durch Transformationen alle Funktionen der Form</p>
<p>$$f(x) = c \\cdot b^{x-d} + e $$</p>
<ul>
  <li>\\(c\\) <strong>streckt</strong> den Graphen in y-Richtung; bei \\(c < 0\\) wird er zusätzlich an der <strong>x-Achse gespiegelt</strong>.<br>
      <em>Mini-Beispiel:</em> \\(f(x) = -2^x\\) ist das Spiegelbild von \\(2^x\\) — alle Werte werden negativ.</li>
  <li>\\(d\\) <strong>verschiebt nach rechts</strong>. Achtung Konvention: Im Term steht \\(x - d\\), und ein <em>Minus</em> im Exponenten bedeutet Verschiebung nach <em>rechts</em>. <br>
      <em>Mini-Beispiel:</em> \\(f(x) = 2^{x-3}\\) ist \\(2^x\\), um 3 nach rechts verschoben.</li>
  <li>\\(e\\) <strong>verschiebt nach oben</strong> — und nimmt dabei die <strong>Asymptote mit</strong>: Sie liegt dann nicht mehr auf der x-Achse, sondern bei \\(y = e\\).<br>
      <em>Mini-Beispiel:</em> \\(f(x) = 2^x + 5\\) hat die Asymptote \\(y = 5\\) und geht durch \\((0\\,|\\,6)\\).</li>
</ul>
<p><strong>Merke:</strong> Die Lage der Asymptote liest du direkt am \\(e\\) ab — \\(c\\) und \\(d\\) ändern sie nicht.</p>` },
  { titel: 'Exponentialgleichungen und Logarithmus',
    html: `
<p>Eine Gleichung, bei der \\(x\\) im Exponenten steht, heißt <strong>Exponentialgleichung</strong>. Manche kannst du durch <strong>Probieren</strong> lösen:</p>
<p>$$3^x = 81 \\;\\Rightarrow\\; x = 4, \\text{ denn } 3^4 = 3 \\cdot 3 \\cdot 3 \\cdot 3 = 81 $$</p>
<p>Wenn Probieren nicht klappt, hilft der <strong>Logarithmus</strong> — er beantwortet die Frage „\\(b\\) hoch <em>was</em> ergibt \\(a\\)?":</p>
<p>$$b^x = a \\;\\Longleftrightarrow\\; x = \\log_b(a) $$</p>
<p><strong>Taschenrechner-Tipp:</strong> Hat dein Rechner keine \\(\\log_b\\)-Taste, rechne \\(x = \\dfrac{\\log(a)}{\\log(b)}\\).</p>
<p><strong>Durchgerechnetes Beispiel:</strong> \\(5 \\cdot 2^x = 80\\)</p>
<ol>
  <li>Beide Seiten durch 5 teilen: \\(2^x = 16\\)</li>
  <li>Lösen (Probieren oder Logarithmus): \\(2^4 = 16\\), also \\(x = 4\\). Kontrolle: \\(x = \\log_2(16) = \\frac{\\log(16)}{\\log(2)} = 4\\). Passt.</li>
</ol>
<p><strong>Ausblick:</strong> Genau so berechnet man die <strong>Verdopplungszeit</strong> (wann ist \\(b^t = 2\\)?) bei Wachstum und die <strong>Halbwertszeit</strong> (wann ist \\(b^t = 0{,}5\\)?) bei Zerfall — wichtig z.&nbsp;B. bei Zinsen oder Radioaktivität.</p>` }
];
