// ── Eingangscheck ───────────────────────────────────────────
const DIAGNOSE = [

    frage: 'Wie viel Grad entsprechen dem Bogenmaß \\(\\dfrac{\\pi}{2}\\)?',

<p>$$f(x) = \\sin(x) \\qquad \\text{und} \\qquad g(x) = \\cos(x) $$</p>
<svg viewBox="0 0 340 200" role="img" aria-label="Sinus- und Kosinuskurve über eine Periode" style="max-width:100%;height:auto;display:block;margin:0.5em auto;">

  <polyline fill="none" stroke="var(--fit-secondary)" stroke-width="2.5" stroke-dasharray="6 4" points="30.0,40.0 35.0,40.3 40.0,41.3 45.0,42.9 50.0,45.2 55.0,48.0 60.0,51.5 65.0,55.4 70.0,59.9 75.0,64.7 80.0,70.0 85.0,75.6 90.0,81.5 95.0,87.5 100.0,93.7 105.0,100.0 110.0,106.3 115.0,112.5 120.0,118.5 125.0,124.4 130.0,130.0 135.0,135.3 140.0,140.1 145.0,144.6 150.0,148.5 155.0,152.0 160.0,154.8 165.0,157.1 170.0,158.7 175.0,159.7 180.0,160.0 185.0,159.7 190.0,158.7 195.0,157.1 200.0,154.8 205.0,152.0 210.0,148.5 215.0,144.6 220.0,140.1 225.0,135.3 230.0,130.0 235.0,124.4 240.0,118.5 245.0,112.5 250.0,106.3 255.0,100.0 260.0,93.7 265.0,87.5 270.0,81.5 275.0,75.6 280.0,70.0 285.0,64.7 290.0,59.9 295.0,55.4 300.0,51.5 305.0,48.0 310.0,45.2 315.0,42.9 320.0,41.3 325.0,40.3 330.0,40.0"/>

<p>Die wichtigsten Eigenschaften im Überblick:</p>
<div class="eigen-tabelle-wrap"><table class="eigen-tabelle">
  <tr><th></th><th>\\(\\sin(x)\\)</th><th>\\(\\cos(x)\\)</th></tr>
  <tr><td>Definitionsbereich</td><td>\\(\\mathbb{R}\\)</td><td>\\(\\mathbb{R}\\)</td></tr>
  <tr><td>Wertebereich</td><td>\\([-1;\\,1]\\)</td><td>\\([-1;\\,1]\\)</td></tr>
  <tr><td>Periode</td><td>\\(2\\pi\\) bzw. 360°</td><td>\\(2\\pi\\) bzw. 360°</td></tr>
  <tr><td>Amplitude</td><td>1</td><td>1</td></tr>
  <tr><td>Symmetrie</td><td>punktsymmetrisch zum Ursprung</td><td>achsensymmetrisch zur y-Achse</td></tr>
</table></div>
<p>Die Kosinuskurve ist eine um \\(\\frac{\\pi}{2}\\) nach links verschobene Sinuskurve — beide Graphen haben dieselbe Form.</p>` },
  { titel: 'Grad- und Bogenmaß',
    html: `
<p>Winkel kannst du in <strong>Grad</strong> (voller Kreis = 360°) oder im <strong>Bogenmaß</strong> (voller Kreis = \\(2\\pi\\), die Länge des Einheitskreis-Bogens) angeben. Die Umrechnung:</p>
<p>$$x_{\\text{rad}} = \\frac{\\alpha}{180°} \\cdot \\pi \\qquad\\qquad \\alpha = \\frac{x_{\\text{rad}}}{\\pi} \\cdot 180° $$</p>
<div class="eigen-tabelle-wrap"><table class="eigen-tabelle">
  <tr><th>Grad</th><td>0°</td><td>30°</td><td>45°</td><td>60°</td><td>90°</td><td>180°</td><td>270°</td><td>360°</td></tr>
  <tr><th>Bogenmaß</th><td>0</td><td>\\(\\frac{\\pi}{6}\\)</td><td>\\(\\frac{\\pi}{4}\\)</td><td>\\(\\frac{\\pi}{3}\\)</td><td>\\(\\frac{\\pi}{2}\\)</td><td>\\(\\pi\\)</td><td>\\(\\frac{3\\pi}{2}\\)</td><td>\\(2\\pi\\)</td></tr>
</table></div>
<p><strong>Beispiel Grad → Bogenmaß:</strong> \\(120° = \\dfrac{120°}{180°} \\cdot \\pi = \\dfrac{2\\pi}{3}\\)</p>
<p><strong>Beispiel Bogenmaß → Grad:</strong> \\(\\dfrac{5\\pi}{6} = \\dfrac{5\\pi/6}{\\pi} \\cdot 180° = \\dfrac{5}{6} \\cdot 180° = 150°\\)</p>` },
  { titel: 'Wichtige Werte',
    html: `
<p>Diese Werte solltest du auswendig kennen — sie sind die Schnitt- und Extrempunkte der Graphen:</p>
<div class="eigen-tabelle-wrap"><table class="eigen-tabelle">
  <tr><th>\\(x\\)</th><td>0°</td><td>90°</td><td>180°</td><td>270°</td><td>360°</td></tr>
  <tr><th>\\(\\sin(x)\\)</th><td>0</td><td>1</td><td>0</td><td>−1</td><td>0</td></tr>
  <tr><th>\\(\\cos(x)\\)</th><td>1</td><td>0</td><td>−1</td><td>0</td><td>1</td></tr>
</table></div>
<ul>
  <li>\\(\\sin(x) = 0\\) bei \\(0°,\\ 180°,\\ 360°,\\ \\dots\\) — also bei allen Vielfachen von 180° (\\(k \\cdot \\pi\\)).</li>
  <li>\\(\\sin(x) = \\pm 1\\) bei \\(90°\\) (Maximum) und \\(270°\\) (Minimum).</li>
  <li>\\(\\cos(x) = 0\\) bei \\(90°,\\ 270°,\\ \\dots\\) — genau zwischen den Nullstellen des Sinus.</li>
  <li>\\(\\cos(x) = \\pm 1\\) bei \\(0°\\) und \\(360°\\) (Maximum) bzw. \\(180°\\) (Minimum).</li>
</ul>` },
  { titel: 'Amplitude, Periode, Verschiebung',
    html: `
<p>Die allgemeine Sinusfunktion hat vier Stellschrauben:</p>
<p>$$f(x) = a \\cdot \\sin\\bigl(b\\,(x - c)\\bigr) + d $$</p>
<ul>
  <li><strong>Amplitude \\(|a|\\):</strong> Höhe des Ausschlags von der Mittellinie. Beispiel: \\(f(x) = 3\\sin(x)\\) schwankt zwischen −3 und 3, die Amplitude ist 3. Bei negativem \\(a\\) ist der Graph zusätzlich an der Mittellinie gespiegelt — die Amplitude bleibt \\(|a|\\).</li>
  <li><strong>Periode \\(\\dfrac{2\\pi}{b}\\):</strong> \\(b\\) staucht oder streckt in x-Richtung. Beispiel: \\(f(x) = \\sin(2x)\\) hat die Periode \\(\\frac{2\\pi}{2} = \\pi\\) — die Kurve schwingt doppelt so schnell.</li>
  <li><strong>Verschiebung \\(c\\) nach rechts:</strong> Beispiel: \\(f(x) = \\sin\\bigl(x - \\frac{\\pi}{4}\\bigr)\\) ist die Sinuskurve, um \\(\\frac{\\pi}{4}\\) nach rechts geschoben.</li>
  <li><strong>Verschiebung \\(d\\) nach oben:</strong> Beispiel: \\(f(x) = \\sin(x) + 2\\) schwankt zwischen 1 und 3.</li>
</ul>
<p><strong>Merke:</strong> Die <strong>Mittellinie</strong> des Graphen ist die waagerechte Gerade \\(y = d\\). Der Wertebereich ist dann \\([d - |a|;\\ d + |a|]\\).</p>` }
];

// ── Workout ─────────────────────────────────────────────────
const AUFGABEN = [
  // Stufe 1
  { id: 1, stufe: 1, typ: 'numerisch',
    frage: 'Rechne \\(90°\\) ins Bogenmaß um. Das Ergebnis hat die Form \\(x = k \\cdot \\pi\\). Gib den Faktor \\(k\\) an (Bruch wie 1/2 oder Dezimalzahl möglich).',
    loesung: 0.5,
    tipp: 'Umrechnungsformel: \\(x = \\dfrac{\\alpha}{180°} \\cdot \\pi\\). Welcher Bruch entsteht aus \\(\\frac{90}{180}\\)?',
