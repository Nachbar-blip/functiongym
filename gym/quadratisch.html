<div id="app"></div>
<script>
const THEMA_KEY = 'fitgym-quadratisch';
const THEMA_CONFIG = { name: 'Quadratische Funktionen' };

// ── Eingangscheck ───────────────────────────────────────────
const DIAGNOSE = [
  { typ: 'mc',
    frage: 'Gegeben ist \\(f(x) = (x - 2)^2 + 3\\). Wo liegt der Scheitelpunkt?',
    optionen: [
      '\\(S(2\\,|\\,3)\\)',
      '\\(S(-2\\,|\\,3)\\)',
      '\\(S(2\\,|\\,-3)\\)',
      '\\(S(3\\,|\\,2)\\)'
    ],
    korrekt: 0,
    loesungsweg: 'In der Scheitelpunktform \\(f(x) = a(x - d)^2 + e\\) ist \\(S(d\\,|\\,e)\\). Achtung beim Vorzeichen: In der Klammer steht \\(x - 2\\), also ist \\(d = 2\\) (nicht \\(-2\\)!). Dahinter steht \\(+3\\), also \\(e = 3\\). Ergebnis: \\(S(2\\,|\\,3)\\).' },
  { typ: 'numerisch',
    frage: 'Gegeben ist \\(f(x) = x^2 - 3x + 1\\). Berechne \\(f(2)\\).',
    loesung: -1,
    loesungsweg: '\\(f(2) = 2^2 - 3 \\cdot 2 + 1 = 4 - 6 + 1 = -1\\).' },
  { typ: 'mc',
    frage: 'Wie verläuft der Graph von \\(f(x) = -0{,}5x^2\\)?',
    optionen: [
      'nach unten geöffnet und gestaucht',
      'nach oben geöffnet und gestaucht',
      'nach unten geöffnet und gestreckt',
      'nach oben geöffnet und gestreckt'
    ],
    korrekt: 0,
    loesungsweg: 'Entscheidend ist \\(a = -0{,}5\\): Das Minus bedeutet nach unten geöffnet. Wegen \\(|a| = 0{,}5 < 1\\) ist die Parabel gestaucht (breiter als die Normalparabel).' },
  { typ: 'numerisch',
    frage: 'Gegeben ist \\(f(x) = (x - 5)(x + 2)\\). Gib die positive Nullstelle an.',
    loesung: 5,
    loesungsweg: 'Ein Produkt ist null, wenn ein Faktor null ist: \\(x - 5 = 0\\) gibt \\(x = 5\\), \\(x + 2 = 0\\) gibt \\(x = -2\\). Die positive Nullstelle ist \\(x = 5\\).' }
];

// ── Technik (Theorie) ───────────────────────────────────────
const THEORIE = [
  { titel: 'Parabeln und die zwei Formen',
    html: `
<p>Eine <strong>quadratische Funktion</strong> kannst du in zwei Formen schreiben:</p>
<p>$$\\text{Normalform: } f(x) = ax^2 + bx + c $$</p>
<p>$$\\text{Scheitelpunktform: } f(x) = a(x - d)^2 + e $$</p>
<p>Ihr Graph ist immer eine <strong>Parabel</strong>. Dabei gilt:</p>
<ul>
  <li>Der <strong>Scheitelpunkt</strong> \\(S(d\\,|\\,e)\\) ist der tiefste (bzw. höchste) Punkt — in der Scheitelpunktform direkt ablesbar.</li>
  <li>\\(a\\) bestimmt <strong>Öffnung und Form</strong>: \\(a > 0\\) nach oben geöffnet, \\(a < 0\\) nach unten; \\(|a| > 1\\) gestreckt (schmaler), \\(|a| < 1\\) gestaucht (breiter).</li>
</ul>
<svg viewBox="0 0 320 235" role="img" aria-label="Normalparabel und verschobene, gestreckte Parabel im Koordinatensystem" style="max-width:100%;height:auto;display:block;margin:0.5em auto;">
  <!-- Gitter -->
  <g stroke="#d0d7e2" stroke-width="1">
    <line x1="100" y1="10" x2="100" y2="215"/><line x1="130" y1="10" x2="130" y2="215"/>
    <line x1="160" y1="10" x2="160" y2="215"/><line x1="190" y1="10" x2="190" y2="215"/>
    <line x1="220" y1="10" x2="220" y2="215"/><line x1="250" y1="10" x2="250" y2="215"/>
    <line x1="280" y1="10" x2="280" y2="215"/>
    <line x1="10" y1="160" x2="310" y2="160"/><line x1="10" y1="130" x2="310" y2="130"/>
    <line x1="10" y1="100" x2="310" y2="100"/><line x1="10" y1="70" x2="310" y2="70"/>
    <line x1="10" y1="40" x2="310" y2="40"/>
  </g>
  <!-- Achsen -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="10" y1="190" x2="310" y2="190"/>
    <line x1="70" y1="220" x2="70" y2="12"/>
  </g>
  <polygon points="310,190 300,186 300,194" fill="#333"/>
  <polygon points="70,12 66,22 74,22" fill="#333"/>
  <text x="300" y="208" font-size="12" fill="#333">x</text>
  <text x="54" y="20" font-size="12" fill="#333">y</text>
  <text x="60" y="206" font-size="11" fill="#333">0</text>
  <text x="97" y="206" font-size="11" fill="#333">1</text>
  <text x="54" y="164" font-size="11" fill="#333">1</text>
  <!-- Normalparabel f(x) = x², Bezier exakt: Endpunkte (-2|4),(2|4), Kontrollpunkt (0|-4) -->
  <path d="M 10 70 Q 70 310 130 70" fill="none" stroke="var(--fit-primary)" stroke-width="2.5"/>
  <circle cx="70" cy="190" r="4" fill="var(--fit-primary)"/>
  <text x="14" y="52" font-size="12" fill="var(--fit-primary)">f(x) = x²</text>
  <text x="76" y="184" font-size="11" fill="var(--fit-primary)">S(0|0)</text>
  <!-- g(x) = 2(x-4)² + 1, Endpunkte (2,5|5,5),(5,5|5,5), Kontrollpunkt (4|-3,5) -->
  <path d="M 145 25 Q 190 295 235 25" fill="none" stroke="var(--fit-secondary)" stroke-width="2.5"/>
  <circle cx="190" cy="160" r="4" fill="var(--fit-secondary)"/>
  <text x="198" y="176" font-size="11" fill="var(--fit-secondary)">S(4|1)</text>
  <text x="212" y="34" font-size="12" fill="var(--fit-secondary)">g(x) = 2(x−4)² + 1</text>
</svg>
<p>Im Bild: die Normalparabel \\(f(x) = x^2\\) mit Scheitel \\(S(0\\,|\\,0)\\) und \\(g(x) = 2(x - 4)^2 + 1\\) — um 4 nach rechts und 1 nach oben verschoben, wegen \\(a = 2\\) gestreckt.</p>` },
  { titel: 'Verschieben, Strecken, Spiegeln',
    html: `
<p>Jeder Baustein der Scheitelpunktform \\(f(x) = a(x - d)^2 + e\\) verändert die Normalparabel \\(y = x^2\\) auf eigene Weise:</p>
<ul>
  <li><strong>\\(d\\) verschiebt waagerecht:</strong> \\(y = (x - 3)^2\\) ist um 3 nach <em>rechts</em> verschoben, \\(y = (x + 3)^2\\) um 3 nach <em>links</em>. Das Vorzeichen in der Klammer ist also „umgedreht".</li>
  <li><strong>\\(e\\) verschiebt senkrecht:</strong> \\(y = x^2 + 2\\) liegt um 2 höher, \\(y = x^2 - 2\\) um 2 tiefer.</li>
  <li><strong>\\(a\\) streckt, staucht und spiegelt:</strong> \\(y = 3x^2\\) ist gestreckt (schmaler), \\(y = 0{,}25x^2\\) gestaucht (breiter), \\(y = -x^2\\) an der x-Achse gespiegelt. Beides zugleich geht auch: \\(y = -2x^2\\) ist gespiegelt <em>und</em> gestreckt.</li>
</ul>
<p><strong>Merke:</strong> \\(d\\) und \\(e\\) verschieben nur den Scheitel — die Form der Parabel bestimmt allein \\(a\\).</p>` },
  { titel: 'Von einer Form in die andere',
    html: `
<p><strong>Scheitelpunktform → Normalform (Ausmultiplizieren):</strong> Binomische Formel anwenden, dann zusammenfassen.</p>
<p>$$\\begin{aligned} f(x) &= 2(x - 1)^2 + 3 \\\\ &= 2(x^2 - 2x + 1) + 3 \\\\ &= 2x^2 - 4x + 5 \\end{aligned} $$</p>
<p><strong>Normalform → Scheitelpunktform (quadratische Ergänzung):</strong> Die Hälfte der Zahl vor dem \\(x\\) quadrieren, addieren und sofort wieder subtrahieren, dann die binomische Formel rückwärts lesen.</p>
<p>$$\\begin{aligned} f(x) &= x^2 + 6x + 7 \\\\ &= x^2 + 6x + 9 - 9 + 7 \\\\ &= (x + 3)^2 - 2 \\end{aligned} $$</p>
<p>Der Scheitelpunkt ist also \\(S(-3\\,|\\,-2)\\).</p>
<p><strong>Merke:</strong> Die <em>Scheitelpunktform</em> zeigt dir sofort den Scheitel (Extrempunkt, z. B. maximale Höhe). Die <em>Normalform</em> brauchst du für die pq-Formel und zum Ablesen des y-Achsenabschnitts \\(c\\).</p>` },
  { titel: 'Nullstellen',
    html: `
<p>Nullstellen sind die Schnittstellen mit der x-Achse: \\(f(x) = 0\\) setzen. Je nach Form gibt es drei Wege:</p>
<p><strong>1. pq-Formel</strong> (Normalform mit \\(a = 1\\), also \\(x^2 + px + q = 0\\)):</p>
<p>$$x_{1,2} = -\\frac{p}{2} \\pm \\sqrt{\\left(\\frac{p}{2}\\right)^2 - q} $$</p>
<p>Beispiel \\(x^2 - 2x - 8 = 0\\): \\(x_{1,2} = 1 \\pm \\sqrt{1 + 8} = 1 \\pm 3\\), also \\(x_1 = -2\\) und \\(x_2 = 4\\).</p>
<p><strong>2. Ausklammern + Satz vom Nullprodukt</strong> (wenn \\(c = 0\\)): Beispiel \\(x^2 - 5x = x(x - 5) = 0\\). Ein Produkt ist null, wenn ein Faktor null ist: \\(x_1 = 0\\), \\(x_2 = 5\\).</p>
<p><strong>3. Scheitelpunktform umstellen:</strong> Beispiel \\((x - 1)^2 - 9 = 0 \\;\\Rightarrow\\; (x - 1)^2 = 9 \\;\\Rightarrow\\; x - 1 = \\pm 3\\), also \\(x_1 = -2\\), \\(x_2 = 4\\).</p>
<p><strong>Hinweis:</strong> Kennst du die Nullstellen \\(x_1\\) und \\(x_2\\), kannst du die Funktion in der <em>faktorisierten Form</em> \\(f(x) = a(x - x_1)(x - x_2)\\) schreiben.</p>` }
];

// ── Workout ─────────────────────────────────────────────────

      '\\(S(4\\,|\\,1)\\)'
    ],
    korrekt: 0,
    tipp: 'Vergleiche mit \\(f(x) = a(x - d)^2 + e\\): Schreibe die Klammer als \\(x - (-4)\\), um \\(d\\) zu erkennen.',
    loesungsweg: '\\((x + 4)^2 = (x - (-4))^2\\), also \\(d = -4\\). Dahinter steht \\(-1\\), also \\(e = -1\\). Scheitelpunkt: \\(S(-4\\,|\\,-1)\\).' },
  { id: 2, stufe: 1, typ: 'zuordnung',
    frage: 'Ordne jeder Gleichung zu, wie ihr Graph aus der Normalparabel \\(y = x^2\\) entsteht.',

      { links: '\\(y = (x - 2)^2 + 1\\)', rechts: 'um 2 nach rechts und 1 nach oben verschoben' },

      { links: '\\(y = x^2 - 3\\)', rechts: 'nur um 3 nach unten verschoben' },
      { links: '\\(y = 3(x + 1)^2\\)', rechts: 'gestreckt und um 1 nach links verschoben' }
    ],
    tipp: 'Schau nacheinander auf \\(a\\) (Spiegeln/Strecken/Stauchen), die Klammer (waagerecht verschieben, Vorzeichen umgedreht!) und die Zahl dahinter (senkrecht verschieben).',
    loesungsweg: '\\((x - 2)^2 + 1\\): \\(d = 2\\) rechts, \\(e = 1\\) hoch. \\(-0{,}5x^2\\): Minus spiegelt, \\(|a| < 1\\) staucht. \\(x^2 - 3\\): nur \\(e = -3\\), also nach unten. \\(3(x + 1)^2\\): \\(a = 3\\) streckt, \\(d = -1\\) nach links.' },
  { id: 3, stufe: 1, typ: 'numerisch',
    frage: 'Gegeben ist \\(f(x) = x^2 + 4x\\). Berechne die negative Nullstelle.',
    loesung: -4,
    tipp: 'Hier ist \\(c = 0\\): Klammere \\(x\\) aus und nutze den Satz vom Nullprodukt.',
    loesungsweg: '\\(x^2 + 4x = x(x + 4) = 0\\). Ein Faktor muss null sein: \\(x_1 = 0\\) oder \\(x + 4 = 0 \\Rightarrow x_2 = -4\\). Die negative Nullstelle ist \\(-4\\).' },
  { id: 4, stufe: 1, typ: 'numerisch',
    frage: 'Löse \\(x^2 - 6x + 8 = 0\\) mit der pq-Formel. Gib die größere Lösung an.',
    loesung: 4,
    tipp: 'Hier ist \\(p = -6\\) und \\(q = 8\\). Also \\(-\\frac{p}{2} = 3\\). Was steht unter der Wurzel?',
    loesungsweg: '\\(x_{1,2} = 3 \\pm \\sqrt{9 - 8} = 3 \\pm 1\\). Also \\(x_1 = 2\\) und \\(x_2 = 4\\). Die größere Lösung ist \\(x = 4\\).' },
  { id: 5, stufe: 1, typ: 'mc',
    frage: 'Welche Normalform gehört zu \\(f(x) = (x - 1)^2 + 2\\)?',
    optionen: [
      '\\(f(x) = x^2 - 2x + 3\\)',
      '\\(f(x) = x^2 + 2x + 3\\)',
      '\\(f(x) = x^2 - 2x + 2\\)',
      '\\(f(x) = x^2 - x + 3\\)'
    ],
    korrekt: 0,
    tipp: 'Binomische Formel: \\((x - 1)^2 = x^2 - 2x + 1\\). Dann die \\(+2\\) nicht vergessen.',
    loesungsweg: '\\((x - 1)^2 + 2 = x^2 - 2x + 1 + 2 = x^2 - 2x + 3\\).' },
  { id: 6, stufe: 1, typ: 'numerisch',
    frage: 'Gegeben ist \\(f(x) = 2(x - 1)^2 - 5\\). Berechne \\(f(3)\\).',
    loesung: 3,
    tipp: 'Setze \\(x = 3\\) ein. Erst die Klammer ausrechnen, dann quadrieren, dann mal 2.',
    loesungsweg: '\\(f(3) = 2 \\cdot (3 - 1)^2 - 5 = 2 \\cdot 4 - 5 = 8 - 5 = 3\\).' },
  // Stufe 2
  { id: 7, stufe: 2, typ: 'numerisch',
    frage: 'Bringe \\(f(x) = x^2 - 8x + 11\\) mit quadratischer Ergänzung in die Scheitelpunktform. Gib die y-Koordinate des Scheitelpunkts an.',
    loesung: -5,
    tipp: 'Ergänze mit \\(\\left(\\frac{8}{2}\\right)^2 = 16\\): addieren und sofort wieder abziehen.',
    loesungsweg: '\\(f(x) = x^2 - 8x + 16 - 16 + 11 = (x - 4)^2 - 5\\). Der Scheitelpunkt ist \\(S(4\\,|\\,-5)\\), die y-Koordinate also \\(-5\\).' },
  { id: 8, stufe: 2, typ: 'mc',
